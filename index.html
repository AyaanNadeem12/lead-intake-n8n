<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student enquiry</title>
<style>
  :root {
    --bg: #eef2f0;
    --panel: #ffffff;
    --ink: #17252a;
    --muted: #5b6b70;
    --line: #c9d4d1;
    --accent: #1f5f5b;
    --accent-ink: #ffffff;
    --error: #a3251d;
    --ok-bg: #e2f1ea;
    --err-bg: #f8e6e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }
  main {
    max-width: 34rem;
    margin: 0 auto;
    padding: 3rem 1.25rem 4rem;
  }
  h1 {
    font-size: 2rem;
    line-height: 1.15;
    margin: 0 0 .5rem;
    font-weight: 700;
  }
  .lede { color: var(--muted); margin: 0 0 2rem; max-width: 30rem; }
  form {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.75rem;
  }
  .field { margin-bottom: 1.25rem; }
  label {
    display: block;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: .9rem;
    font-weight: 600;
    margin-bottom: .35rem;
  }
  input, select {
    width: 100%;
    font: inherit;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1rem;
    padding: .65rem .75rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid #7fb8b3;
    outline-offset: 1px;
  }
  .invalid input, .invalid select { border-color: var(--error); }
  .msg {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: .85rem;
    color: var(--error);
    margin: .3rem 0 0;
    min-height: 0;
  }
  .hidden { display: none; }
  /* honeypot: off-screen, not display:none, so simple bots still fill it */
  .hp { position: absolute; left: -9999px; height: 0; overflow: hidden; }
  button {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1rem;
    font-weight: 600;
    width: 100%;
    padding: .8rem 1rem;
    border: 0;
    border-radius: 4px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  .banner {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    border-radius: 4px;
    padding: .85rem 1rem;
    margin-bottom: 1.25rem;
  }
  .banner.ok { background: var(--ok-bg); color: #14513a; }
  .banner.err { background: var(--err-bg); color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Tell us what you want to study</h1>
  <p class="lede">Send your details and an admissions adviser will get back to you by email.</p>

  <form id="lead-form" novalidate>
    <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>

    <div class="field" data-field="name">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
      <p class="msg"></p>
    </div>

    <div class="field" data-field="email">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <p class="msg"></p>
    </div>

    <div class="field" data-field="phone">
      <label for="phone">Phone (with country code)</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+92 300 1234567" required>
      <p class="msg"></p>
    </div>

    <div class="field" data-field="country">
      <label for="country">Country</label>
      <select id="country" name="country" required>
        <option value="" selected disabled>Select your country</option>
        <option>Pakistan</option>
        <option>India</option>
        <option>Bangladesh</option>
        <option>Sri Lanka</option>
        <option>United States</option>
        <option>Canada</option>
        <option>United Kingdom</option>
        <option>Germany</option>
        <option>United Arab Emirates</option>
        <option>Saudi Arabia</option>
        <option>Nigeria</option>
        <option>China</option>
        <option>Australia</option>
        <option value="Other">Other</option>
      </select>
      <p class="msg"></p>
    </div>

    <div class="field hidden" id="country-other-field" data-field="country_other">
      <label for="country_other">Your country</label>
      <input id="country_other" name="country_other" type="text">
      <p class="msg"></p>
    </div>

    <div class="field" data-field="programme">
      <label for="programme">Programme of interest</label>
      <select id="programme" name="programme" required>
        <option value="" selected disabled>Select a programme</option>
        <option>Computer Science</option>
        <option>Business Administration</option>
        <option>Engineering</option>
        <option value="Other">Other</option>
      </select>
      <p class="msg"></p>
    </div>

    <div class="field hidden" id="programme-other-field" data-field="programme_other">
      <label for="programme_other">Which programme?</label>
      <input id="programme_other" name="programme_other" type="text">
      <p class="msg"></p>
    </div>

    <!-- honeypot -->
    <div class="hp" aria-hidden="true">
      <label for="website">Leave this empty</label>
      <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" id="submit">Send enquiry</button>
  </form>
</main>

<script>
  // Change this if your tunnel URL changes.
  const WEBHOOK_URL =
    "https://rural-prot-vincent-keyword.trycloudflare.com/webhook/lead-intake";

  const form = document.getElementById("lead-form");
  const banner = document.getElementById("banner");
  const submitBtn = document.getElementById("submit");

  const toggle = (selectId, wrapId) => {
    const wrap = document.getElementById(wrapId);
    const show = document.getElementById(selectId).value === "Other";
    wrap.classList.toggle("hidden", !show);
  };
  document.getElementById("programme").addEventListener("change", () => toggle("programme", "programme-other-field"));
  document.getElementById("country").addEventListener("change", () => toggle("country", "country-other-field"));

  function clearErrors() {
    banner.className = "banner hidden";
    banner.textContent = "";
    form.querySelectorAll(".field").forEach((f) => {
      f.classList.remove("invalid");
      f.querySelector(".msg").textContent = "";
    });
  }

  function setError(field, message) {
    const wrap = form.querySelector(`[data-field="${field}"]`);
    if (!wrap) return false;
    wrap.classList.add("invalid");
    wrap.querySelector(".msg").textContent = message;
    return true;
  }

  function showBanner(kind, text) {
    banner.className = "banner " + kind;
    banner.textContent = text;
    banner.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErrors();

    // Bots fill the hidden field; pretend success and send nothing.
    if (document.getElementById("website").value) {
      showBanner("ok", "Thank you, we have received your enquiry.");
      form.reset();
      return;
    }

    const v = (id) => document.getElementById(id).value.trim();
    const countrySel = v("country");
    const programme = v("programme");

    // Light client-side check for the two "Other" boxes; the server validates everything else.
    let bad = false;
    if (countrySel === "Other" && !v("country_other")) {
      setError("country_other", "Enter your country");
      bad = true;
    }
    if (bad) return;

    const payload = {
      name: v("name"),
      email: v("email"),
      phone: v("phone"),
      country: countrySel === "Other" ? v("country_other") : countrySel,
      programme: programme,
    };
    if (programme === "Other") payload.programme_other = v("programme_other");

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      let data = {};
      try { data = await res.json(); } catch (_) {}

      if (res.status === 400 && Array.isArray(data.errors)) {
        const unplaced = [];
        data.errors.forEach((err) => {
          // A missing country when "Other" is chosen shows under the extra box.
          const field = err.field === "country" && countrySel === "Other" ? "country_other" : err.field;
          if (!setError(field, err.message)) unplaced.push(err.message);
        });
        showBanner("err", unplaced.length ? unplaced.join(" ") : "Please fix the highlighted fields.");
      } else if (res.ok && data.success) {
        showBanner("ok", data.message || "Thank you, we have received your enquiry.");
        form.reset();
        toggle("programme", "programme-other-field");
        toggle("country", "country-other-field");
      } else {
        showBanner("err", data.message || "We could not send your enquiry. Please try again in a few minutes.");
      }
    } catch (err) {
      // Network failure, tunnel down, or CORS blocked
      showBanner("err", "We could not reach the server. Check your connection and try again.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send enquiry";
    }
  });
</script>
</body>
</html>
